# Development Docker Compose Override
# This file is automatically loaded by docker-compose when running locally
# It overrides production settings for development convenience

services:
  backend:
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./:/app
      - /app/__pycache__
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1
      - DEBUG=true
    volumes:
      - ./:/app
      - /app/__pycache__

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
