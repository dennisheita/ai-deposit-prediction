<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #333; }
        .map-container { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Results</h1>
        <p>Prediction completed. Results saved as {{ filename }}</p>

        <div class="map-container">
            {{ map_html|safe }}
        </div>

        <p><strong>Legend:</strong> Red = Predicted Deposit, Blue = No Deposit, Heatmap = Probability Distribution</p>

        <a href="/predict">Run Another Prediction</a> | <a href="/">Home</a>
    </div>
</body>
</html>
