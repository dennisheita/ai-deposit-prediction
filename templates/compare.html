<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Comparison</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #333; }
        form { margin-top: 20px; }
        select { display: block; margin-bottom: 10px; padding: 8px; width: 100%; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .model { display: inline-block; width: 45%; vertical-align: top; margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Model Comparison - {{ selected_mineral }}</h1>

        <form method="post">
            <label for="model1">Select Model 1:</label>
            <select name="model1" required>
                {% for model in models %}
                    <option value="{{ model[0] }}">{{ model[1] }}</option>
                {% endfor %}
            </select>

            <label for="model2">Select Model 2:</label>
            <select name="model2" required>
                {% for model in models %}
                    <option value="{{ model[0] }}">{{ model[1] }}</option>
                {% endfor %}
            </select>

            <button type="submit">Compare</button>
        </form>

        {% if model1 and model2 %}
            <div class="model">
                <h2>Model {{ model1[1] }}</h2>
                <p>Best Score: {{ model1[2] }}</p>
                <p>Created: {{ model1[3] }}</p>
            </div>
            <div class="model">
                <h2>Model {{ model2[1] }}</h2>
                <p>Best Score: {{ model2[2] }}</p>
                <p>Created: {{ model2[3] }}</p>
            </div>
        {% endif %}

        <a href="/">Home</a>
    </div>
</body>
</html>
